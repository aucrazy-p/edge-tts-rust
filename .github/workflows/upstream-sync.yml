name: Sync Upstream Dependency

# 每天检查一次依赖库 edge-tts-rust 在 crates.io 有没有新版本。
# 有则自动升级 Cargo.toml + Cargo.lock，编译验证通过后提交、打 tag，
# 再复用 release.yml 三平台构建并发布 Release。
# 服务器端执行 `bash install.sh update` 即可换成新版。

on:
  schedule:
    # 每天 01:17 UTC（北京时间 09:17）；错开整点，避开 GitHub Actions 排队高峰
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      target_version:
        description: "强制升级到指定版本（留空=自动检测 crates.io 最新版；填版本号可验证整条链路）"
        type: string
        required: false
        default: ""

permissions:
  contents: write

# 同一时间只允许一个同步任务，避免两次运行互相抢着打 tag
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: 检查上游并升级
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ver.outputs.changed }}
      old_version: ${{ steps.ver.outputs.old }}
      new_version: ${{ steps.ver.outputs.new }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史和 tag，用于计算下一个项目版本号
          fetch-depth: 0

      - name: 对比当前锁定版本与 crates.io 最新版
        id: ver
        env:
          # 通过环境变量传入，避免把用户输入直接拼进 shell
          FORCE_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail

          CUR=$(grep -oE '^edge-tts-rust = "=[0-9.]+"' Cargo.toml \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$CUR" ]; then
            echo "::error::Cargo.toml 中未找到 edge-tts-rust 的精确版本约束（形如 =0.1.7）"
            exit 1
          fi

          if [ -n "${FORCE_VERSION:-}" ]; then
            LATEST="$FORCE_VERSION"
            FORCED=1
            echo "手动指定目标版本: $LATEST"
          else
            FORCED=0
            # crates.io 强制要求 User-Agent，缺了会 403
            LATEST=$(curl -fsSL -H "User-Agent: tts-server-rust-upstream-sync" \
                     https://crates.io/api/v1/crates/edge-tts-rust \
                     | jq -r '.crate.max_stable_version // empty')
            if [ -z "$LATEST" ]; then
              echo "::error::无法从 crates.io 获取 edge-tts-rust 最新版本"
              exit 1
            fi
          fi

          echo "当前锁定: $CUR"
          echo "目标版本: $LATEST"
          echo "old=$CUR" >> "$GITHUB_OUTPUT"
          echo "new=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CUR" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本相同，无需升级，流程结束。"
            exit 0
          fi

          if [ "$FORCED" = "1" ]; then
            echo "::warning::手动指定了版本，跳过版本高低校验（可降级，由操作者负责）"
          else
            # 仅在上游严格更高时才升，防止上游 yank 后版本号回退把仓库搞乱
            HIGHEST=$(printf '%s\n%s\n' "$CUR" "$LATEST" | sort -V | tail -1)
            if [ "$HIGHEST" != "$LATEST" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "上游 $LATEST 不高于当前 $CUR，跳过。"
              exit 0
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # 项目自身版本号：在当前最大 v* tag 的 patch 位 +1
          # 注意这与依赖版本是两套独立编号
          # 显式同步一次 tag，防止托管缓存或浅克隆导致 tag 列表缺失
          git fetch --tags --force origin >/dev/null 2>&1 || true

          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.1.0"
          else
            BASE=${LATEST_TAG#v}
            MAJ=${BASE%%.*}
            REST=${BASE#*.}
            MIN=${REST%%.*}
            PAT=${REST#*.}
            NEXT_TAG="v${MAJ}.${MIN}.$((PAT + 1))"
          fi

          # 若算出的 tag 已存在（历史遗留或并发残留），继续往上找空位
          while git rev-parse -q --verify "refs/tags/$NEXT_TAG" >/dev/null 2>&1; do
            B2=${NEXT_TAG#v}
            P2=${B2##*.}
            H2=${B2%.*}
            NEXT_TAG="v${H2}.$((P2 + 1))"
          done
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "本次将发布: $NEXT_TAG"

      - name: 安装 Rust 工具链
        if: steps.ver.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: 升级依赖并刷新锁文件
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.ver.outputs.new }}"
          sed -i -E "s|^edge-tts-rust = \"=[0-9.]+\"|edge-tts-rust = \"=$NEW\"|" Cargo.toml
          cargo update -p edge-tts-rust --precise "$NEW"
          echo "--- Cargo.toml ---"
          grep -n '^edge-tts-rust' Cargo.toml
          echo "--- Cargo.lock ---"
          grep -A 1 'name = "edge-tts-rust"' Cargo.lock | head -4

      - name: 编译验证（不通过就不提交）
        if: steps.ver.outputs.changed == 'true'
        run: cargo build --release

      - name: 提交并打标签
        id: commit
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.ver.outputs.new }}"
          TAG="${{ steps.ver.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "::error::依赖已解析到 $NEW，但 Cargo.toml / Cargo.lock 无任何变更"
            exit 1
          fi

          git commit -m "chore(deps): 升级 edge-tts-rust 到 $NEW"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          git tag -a "$TAG" -m "edge-tts-rust $NEW"
          git push origin "$TAG"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "已提交并打标签 $TAG"

  build-release:
    name: 构建并发布
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      publish: true
      tag_name: ${{ needs.sync.outputs.tag }}
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: write
